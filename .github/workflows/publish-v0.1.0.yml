name: Publish Passkey Assertion Guard v0.1.0
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.1.0.yml

permissions:
  contents: write

jobs:
  release:
    name: Validate and publish stable GitHub release
    if: github.repository == 'felipewatter/passkey-assertion-guard'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate target release commit
        env:
          RELEASE_COMMIT: 51b19260aec985f3696d059a23d4fd230838c0cd
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$RELEASE_COMMIT" HEAD
          git show "$RELEASE_COMMIT:package.json" | grep -Fq '"version": "0.1.0"'
          test -s .github/release-notes-v0.1.0.md
      - name: Setup Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Final regression validation
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm run verify-project
      - name: Create npm package for GitHub release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist
          test -s dist/felipewatter-passkey-assertion-guard-0.1.0.tgz
      - name: Publish stable release without overwriting previous release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: 51b19260aec985f3696d059a23d4fd230838c0cd
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.1.0 already exists; refusing to overwrite."
            exit 0
          fi
          gh release create v0.1.0 dist/felipewatter-passkey-assertion-guard-0.1.0.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title "Passkey Assertion Guard v0.1.0 — WebAuthn Authentication Assertion Verification" \
            --notes-file .github/release-notes-v0.1.0.md \
            --latest
